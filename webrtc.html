<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>(runoob.com)</title>
<script>
    // 使用 WebRTC API 获取本机网络信息
function getInternalIP() {
  return new Promise((resolve, reject) => {
    const { RTCPeerConnection, RTCSessionDescription } = window;
    const pc = new RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('');
    pc.createOffer()
      .then((offer) => {
        const desc = new RTCSessionDescription(offer);
        pc.setLocalDescription(desc);
      })
      .catch(reject);

    pc.onicecandidate = (e) => {
      if (e.candidate) {
        console.log(e.candidate);//ts
        var a='192.168.110.199'.match(/(192\.168\.\d+\.\d+)/);
        console.log(a[0]);
        const match = e.candidate.candidate.match(/(192\.168\.\d+\.\d+)/);
        if (match) {
          resolve(match[1]);
        }
      } else {
        reject(new Error('Failed to get internal IP'));
      }
    };
  });
}
var myIP;
// 使用示例
getInternalIP().then((ip) => {
    myIP=ip;
  console.log('Internal IP:', ip);
}).catch((error) => {
  console.error(error);
});
function displayDate(){
	document.getElementById("demo").innerHTML=myIP;
}
</script>
</head>
<body>

<h1> js test</h1>
<p id="demo">part</p>

<button type="button" onclick="displayDate()">显示ip</button>

</body>
</html>
